<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emoji Words</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">
<style>
:root{--h:230;--bg:hsl(var(--h) 45% 96%);--ink:hsl(var(--h) 50% 18%);--panel:hsl(var(--h) 45% 88%);--dark:hsl(var(--h) 40% 50%);--muted:hsl(var(--h) 20% 42%);--pop:hsl(var(--h) 42% 44%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:hsl(var(--h) 35% 12%);--ink:hsl(var(--h) 60% 95%);--panel:hsl(var(--h) 30% 19%);--dark:hsl(var(--h) 36% 46%);--muted:hsl(var(--h) 25% 70%);--pop:hsl(var(--h) 38% 46%)}}
:root[data-theme="dark"]{--bg:hsl(var(--h) 35% 12%);--ink:hsl(var(--h) 60% 95%);--panel:hsl(var(--h) 30% 19%);--dark:hsl(var(--h) 36% 46%);--muted:hsl(var(--h) 25% 70%);--pop:hsl(var(--h) 38% 46%)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-size:18px;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 16px 40px;text-align:center}
h1{margin:0 0 8px;font-family:"Rubik Doodle Shadow","Outfit",system-ui,sans-serif;font-weight:400;font-size:clamp(30px,9.5vw,44px);letter-spacing:1px;line-height:1.1}
.sub{margin:0 0 16px;color:var(--muted);font-size:18px}
.emo{display:flex;align-items:flex-start;justify-content:center;gap:6px;background:var(--panel);border-radius:14px;padding:16px 8px;margin:0 auto 16px;max-width:420px;flex-wrap:wrap}
.emo .e{display:flex;flex-direction:column;align-items:center;min-width:64px}
.emo .e b{font-size:clamp(44px,15vw,64px);line-height:1.1;font-weight:400;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.emo .plus{align-self:center;font-size:28px;font-weight:700;color:var(--muted)}
.tiles{position:relative;display:flex;gap:4px;justify-content:center;margin-bottom:16px;flex-wrap:nowrap;cursor:text}
.tiles.no{animation:shake .3s}
.t{width:clamp(22px,7.2vw,36px);height:clamp(32px,9.6vw,46px);border-radius:6px;background:var(--panel);display:grid;place-items:center;font-size:clamp(15px,4.8vw,24px);font-weight:800;text-transform:uppercase;color:var(--ink)}
.t.on{background:var(--dark);color:#fff}
#g{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;font-size:16px;cursor:text}
.msg{min-height:26px;font-weight:600;margin:0 0 14px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button{font:inherit;font-weight:600;padding:6px 18px;border-radius:8px;border:2px solid var(--muted);background:transparent;color:var(--ink);cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.end{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
.win{background:var(--pop);color:#fff;border-radius:10px;padding:12px;font-size:22px;font-weight:800;max-width:420px;margin:0 auto;animation:pop .5s ease-out;word-break:break-word}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.win,.tiles.no{animation:none}}
@media (min-width:800px){
body{font-size:26px}
main{max-width:820px;padding-top:32px}
h1{font-size:66px;margin-bottom:12px}
.sub{font-size:25px}
.emo{max-width:620px;padding:22px 12px}
.emo .e b{font-size:90px}
.t{width:56px;height:70px;font-size:36px}
.msg{min-height:40px}
.end button{padding:8px 26px}
.win{font-size:30px;max-width:620px}
}
</style>
</head>
<body>
<main>
  <h1>Emoji Words</h1>
  <p class="sub">Put the emojis together to make one word.</p>
  <div class="emo" id="emo" aria-label="Emoji puzzle"></div>
  <div class="msg" id="msg" role="status"></div>
  <div class="tiles" id="tiles" aria-label="Answer tiles"><div id="tl" style="display:contents"></div><input id="g" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Your answer"></div>
  <div class="end"><button id="new">New game</button><button id="hint">Hint (3)</button><button id="give">Give up</button></div>
</main>
<script>
const P=[[["🌙","📅"],["moon","day"],"monday"],[["☀️","📅"],["sun","day"],"sunday"],[["🌃","🐴"],["night","mare"],"nightmare"],[["☀️","📺"],["sun","screen"],"sunscreen"],[["🌞","💭"],["day","dream"],"daydream"],[["👶","📅"],["birth","day"],"birthday"],[["🌶️","🌿"],["pepper","mint"],"peppermint"],[["🧱","🌸"],["wall","flower"],"wallflower"],[["💡","🏠"],["light","house"],"lighthouse"],[["🔑","📋"],["key","board"],"keyboard"],[["🎵","📖"],["note","book"],"notebook"],[["🔙","📦"],["back","pack"],"backpack"],[["☝️","💅"],["finger","nail"],"fingernail"],[["👁️","🤨"],["eye","brow"],"eyebrow"],[["🪑","👨"],["chair","man"],"chairman"],[["🌙","🚶"],["moon","walk"],"moonwalk"],[["🐉","🪰"],["dragon","fly"],"dragonfly"],[["🐂","🐸"],["bull","frog"],"bullfrog"],[["🔴","🪵"],["red","wood"],"redwood"],[["🟢","🏠"],["green","house"],"greenhouse"],[["⚫","🍓"],["black","berry"],"blackberry"],[["☕","📋"],["cup","board"],"cupboard"],[["🔵","🔔"],["blue","bell"],"bluebell"],[["🥵","🐕"],["hot","dog"],"hotdog"],[["📬","📦"],["mail","box"],"mailbox"],[["🧠","⛈️"],["brain","storm"],"brainstorm"],[["🧀","🎂"],["cheese","cake"],"cheesecake"],[["❤️","🥁"],["heart","beat"],"heartbeat"],[["☀️","🔥"],["sun","burn"],"sunburn"],[["🐝","🍃"],["be","leaf"],"belief"],[["🌊","🪚"],["sea","saw"],"seesaw"],[["🚗","🚶"],["car","go"],"cargo"],[["🚗","🐾"],["car","pet"],"carpet"],[["🧊","🏔️"],["ice","berg"],"iceberg"],[["🐻","🦶"],["bear","foot"],"barefoot"],[["🍯","🌙"],["honey","moon"],"honeymoon"],[["👂","💍"],["ear","ring"],"earring"],[["💧","🍉"],["water","melon"],"watermelon"],[["🌾","🍓"],["straw","berry"],"strawberry"],[["🔽","💧"],["under","water"],"underwater"],[["🕷️","🕸️"],["spider","web"],"spiderweb"],[["🐜","⛰️"],["ant","hill"],"anthill"],[["🛏️","⏰"],["bed","time"],"bedtime"],[["🌳","🏠"],["tree","house"],"treehouse"],[["🐱","🅰️","🪵"],["cat","a","log"],"catalog"],[["🚗","🅰️","🚐"],["car","a","van"],"caravan"],[["🍻","🐝","🎱"],["bar","be","cue"],"barbecue"],[["👁️","🏞️"],["eye","land"],"island"],[["🏖️","🧙‍♀️"],["sand","witch"],"sandwich"],[["☠️","📏"],["dead","line"],"deadline"],[["🌌","🍸"],["space","bar"],"spacebar"],[["🌙","🔦"],["moon","beam"],"moonbeam"],[["👩","🐦"],["lady","bird"],"ladybird"],[["🌾","🍽️"],["oat","meal"],"oatmeal"],[["🥚","🐚"],["egg","shell"],"eggshell"],[["🏖️","📄"],["sand","paper"],"sandpaper"],[["🥜","🐚"],["nut","shell"],"nutshell"],[["🖊️","🔪"],["pen","knife"],"penknife"],[["🌽","🕸️"],["cob","web"],"cobweb"],[["🐱","😴"],["cat","nap"],"catnap"],[["🛏️","🐛"],["bed","bug"],"bedbug"],[["👄","🏒"],["lip","stick"],"lipstick"],[["💪","🪑"],["arm","chair"],"armchair"],[["☁️","📏"],["sky","line"],"skyline"],[["🚆","🛣️"],["rail","way"],"railway"],[["🍲","🕳️"],["pot","hole"],"pothole"],[["👟","🎀"],["shoe","lace"],"shoelace"],[["✝️","💬"],["cross","word"],"crossword"],[["🌠","🦴"],["wish","bone"],"wishbone"],[["🕯️","💡"],["candle","light"],"candlelight"],[["🔽","🐕"],["under","dog"],"underdog"],[["🦴","🔥"],["bone","fire"],"bonfire"],[["🌙","✨"],["moon","shine"],"moonshine"],[["🔽","🧍"],["under","stand"],"understand"],[["💔","🏃"],["break","fast"],"breakfast"],[["🎫","⚓"],["pass","port"],"passport"],[["🌊","👦"],["sea","son"],"season"],[["🛣️","🪨"],["mile","stone"],"milestone"],[["🌽","🐕"],["corn","dog"],"corndog"],[["🎡","🍻","🚣"],["wheel","bar","row"],"wheelbarrow"],[["⭐","🐟"],["star","fish"],"starfish"],[["🧈","🪰"],["butter","fly"],"butterfly"],[["☀️","🌻"],["sun","flower"],"sunflower"],[["🌧️","🎀"],["rain","bow"],"rainbow"],[["❄️","👨"],["snow","man"],"snowman"],[["🦶","⚽"],["foot","ball"],"football"],[["🦷","🪥"],["tooth","brush"],"toothbrush"],[["🔥","🪰"],["fire","fly"],"firefly"],[["🍳","🎂"],["pan","cake"],"pancake"],[["☕","🧁"],["cup","cake"],"cupcake"],[["🌧️","🧥"],["rain","coat"],"raincoat"],[["🚪","🔔"],["door","bell"],"doorbell"],[["🧺","🏀"],["basket","ball"],"basketball"],[["🥇","🐟"],["gold","fish"],"goldfish"],[["🍮","🐟"],["jelly","fish"],"jellyfish"],[["🌊","🐴"],["sea","horse"],"seahorse"],[["🐴","👟"],["horse","shoe"],"horseshoe"],[["📖","🔖"],["book","mark"],"bookmark"],[["🦶","🐾"],["foot","print"],"footprint"],[["🌲","🍎"],["pine","apple"],"pineapple"]];
const HUES=[0,15,155,180,205,230,260,285,320];
const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let deck=[],cur,hintLevel=0,over=false,solved=false,hue=-1,round=0,flashT,typed="";
function flash(t,ms){const m=$("msg");if(over)return;m.textContent=t;clearTimeout(flashT);flashT=setTimeout(()=>{if(!over)m.textContent=""},ms||1800)}
const hintIdx=()=>{const n=cur[2].length;return [0,n-1,Math.floor(n/2)].slice(0,hintLevel)};
const freeIdx=()=>{const h=hintIdx();return [...cur[2]].map((_,i)=>i).filter(i=>!h.includes(i))};
function draw(){
  const [em,names,ans]=cur;
  $("emo").innerHTML=em.map(e=>`<div class="e"><b>${e}</b></div>`).join('<div class="plus">+</div>');
  const show=solved||over,h=hintIdx(),free=freeIdx();
  $("tl").innerHTML=[...ans].map((c,i)=>{
    const k=free.indexOf(i);
    const hinted=h.includes(i),t=typed[k]||"";
    const on=show||hinted;
    return `<div class="t${on?" on":""}">${on?c:(k>=0?t:"")}</div>`;
  }).join("");
  $("hint").textContent=`Hint (${3-hintLevel})`;
  $("hint").disabled=over||hintLevel>=3;
}
function merged(){const f=freeIdx(),h=hintIdx(),a=[...cur[2]].map(()=>"");h.forEach(i=>a[i]=cur[2][i]);f.forEach((i,k)=>a[i]=typed[k]||"");return a.join("")}
function lock(){over=true;$("g").disabled=true;$("hint").disabled=true;$("give").disabled=true}
function start(){
  round++;
  const prev=cur&&cur[2];
  if(!deck.length){deck=shuffle(P);if(prev&&deck[deck.length-1][2]===prev)deck.unshift(deck.pop())}
  cur=deck.pop();
  let h;do{h=HUES[Math.floor(Math.random()*HUES.length)]}while(h===hue);
  hue=h;document.documentElement.style.setProperty("--h",h);
  hintLevel=0;over=false;solved=false;typed="";
  $("msg").textContent="";$("g").value="";$("g").disabled=false;$("give").disabled=false;
  draw();
}
function newGame(){start();$("g").focus()}
function nameOf(who){let nm=who||"";try{nm=nm||(new URLSearchParams(location.search).get("name")||window.playerName||"").trim().slice(0,30)}catch(e){}return nm||"Player"}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
  const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);t++;
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(t<160)requestAnimationFrame(f);else c.remove();
  })();
}
function popup(name,word){
  const d=document.createElement("div");d.className="win";
  const l=document.createElement("div");l.className="wl";l.textContent=`${name} won with '${word}'`;d.appendChild(l);
  const m=$("msg");m.textContent="";m.appendChild(d);
  const r=round;setTimeout(()=>{if(over&&round===r)start()},6000);
}
function guess(word,name){
  if(over)return"over";
  const w=String(word||"").trim().toLowerCase().replace(/[^a-z]/g,"");
  if(!w)return"bad";
  const ans=cur[2];
  if(w.length!==ans.length)return"len";
  if(w===ans){
    solved=true;lock();$("g").value="";draw();
    popup(nameOf(String(name||"").trim().slice(0,30)),ans);confetti();
    return"ok";
  }
  flash("Not quite. Try again.");
  return"wrong";
}
function shakeTiles(){const t=$("tiles");t.classList.remove("no");void t.offsetWidth;t.classList.add("no")}
function submitTyped(force){
  if(over)return;
  const need=freeIdx().length;
  if(!typed)return;
  if(typed.length<need){
    if(force){shakeTiles();flash(`The answer has ${cur[2].length} letters.`)}
    return;
  }
  const r=guess(merged(),"");
  if(r==="wrong"){typed="";$("g").value="";shakeTiles();draw()}
  if(!over)$("g").focus();
}
$("g").oninput=()=>{
  const need=freeIdx().length;
  typed=$("g").value.toLowerCase().replace(/[^a-z]/g,"").slice(0,need);
  $("g").value=typed;draw();submitTyped(false);
};
$("g").onkeydown=e=>{if(e.key==="Enter")submitTyped(true)};
$("tiles").onclick=()=>{if(!over)$("g").focus()};
$("hint").onclick=()=>{
  if(over||hintLevel>=3)return;
  hintLevel++;
  typed=typed.slice(0,freeIdx().length);$("g").value=typed;
  flash(["Hint: here is the starting letter.","Hint: here is the ending letter.","Hint: here is the middle letter."][hintLevel-1],2500);
  draw();
  if(typed.length&&typed.length===freeIdx().length)submitTyped(false);else $("g").focus();
};
$("give").onclick=()=>{
  if(over)return;
  lock();draw();
  $("msg").textContent=`You gave up. The word was ${cur[2]}.`;
  const r=round;setTimeout(()=>{if(over&&round===r)start()},6000);
};
$("new").onclick=newGame;
window.submitGuess=guess;
window.addEventListener("message",e=>{const d=e.data;if(d&&d.type==="guess")guess(d.word,d.name)});
const LIVE=/[?&]live=1/.test(location.search)||location.protocol==="file:";
function tikfinity(){let ws;try{ws=new WebSocket("ws://127.0.0.1:21213/")}catch(e){return}
ws.onmessage=ev=>{try{const m=JSON.parse(ev.data),d=m.data||m;if(!/chat|comment/i.test(String(m.event||m.type||"")))return;const u=d.user||{};guess(d.comment||d.text||d.message,d.nickname||d.uniqueId||u.nickname||u.uniqueId)}catch(e){}};
ws.onclose=()=>setTimeout(tikfinity,3000);ws.onerror=()=>ws.close()}
if(LIVE)tikfinity();
newGame();
</script>
</body>
</html>
